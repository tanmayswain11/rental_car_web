<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/zibago.jpeg"
    />

    <link
      rel="apple-touch-icon"
      href="/zibago.jpeg"
    />

    <!-- SEO -->
    <title>Best Self-Drive Car In Bhubaneswar | Car Rental With 10% off</title>

    <meta
      name="description"
      content="Book reliable and affordable car rental in Odisha and Bhubaneswar with ZibaGo. Rent a car for local travel, business trips, airport travel, self-drive and flexible rental needs."
    />

    <meta
      name="author"
      content="ZibaGo"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://zibago.com/"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="ZibaGo - Car Rental in Odisha & Bhubaneswar"
    />

    <meta
      property="og:description"
      content="Book reliable and affordable self-drive & car rentals in Bhubaneswar and across Odisha with ZibaGo."
    />

    <meta
      property="og:url"
      content="https://zibago.com/"
    />

    <meta
      property="og:site_name"
      content="ZibaGo"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:image"
      content="https://zibago.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="ZibaGo - Car Rental in Odisha and Bhubaneswar"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="ZibaGo - Car Rental in Odisha & Bhubaneswar"
    />

    <meta
      name="twitter:description"
      content="Book reliable and affordable car rentals in Bhubaneswar and Odisha with ZibaGo."
    />

    <meta
      name="twitter:image"
      content="https://zibago.com/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="ZibaGo Car Rental"
    />

    <!-- Language -->
    <meta
      http-equiv="content-language"
      content="en-IN"
    />

    <!-- Referrer -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ZibaGo",
        "url": "https://zibago.com/",
        "description": "Car rental services in Odisha and Bhubaneswar."
      }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ZibaGo",
        "url": "https://zibago.com/",
        "logo": "https://zibago.com/zibago.jpeg",
        "description": "ZibaGo provides car rental services in Odisha and Bhubaneswar."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite / React entry point -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
